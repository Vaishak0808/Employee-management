<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="full-width-table">

      <ng-container matColumnDef="SL_No">
        <th mat-header-cell *matHeaderCellDef> Sl No. </th>
        <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
      </ng-container>
  
      <ng-container matColumnDef="form_name">
        <th mat-header-cell *matHeaderCellDef> Form Name </th>
        <td mat-cell *matCellDef="let element"> {{ element.fk_form__form_name }} </td>
      </ng-container>
  

      <ng-container matColumnDef="created_date">
        <th mat-header-cell *matHeaderCellDef> Created Date </th>
        <td mat-cell *matCellDef="let element"> {{ element.dat_created__date| date:'dd-MM-yyyy' }} </td>
      </ng-container>
  
      <ng-container matColumnDef="created_by">
        <th mat-header-cell *matHeaderCellDef> Created By </th>
        <td mat-cell *matCellDef="let element">{{element.fk_created__first_name}} {{ element.fk_created__last_name }} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  </div>
